name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_call:

permissions:
  contents: read

jobs:
  tests:
    name: Python ${{ matrix.python-version }} / ${{ matrix.torch-requirement }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        torch-requirement: ["torch>=2.2,<3"]
        include:
          - python-version: "3.10"
            torch-requirement: "torch==2.1.0"
            # Torch 2.1 predates the NumPy 2 ABI. This is a CI constraint only.
            numpy-requirement: "numpy<2"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Show versions (debug)
        run: |
          python -V
          pip -V

      - name: Upgrade pip & wheel
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -U pip wheel

      - name: Set environment constraints
        run: |
          printf '%s\n' "${{ matrix.numpy-requirement || 'numpy>=1.24' }}" > "$RUNNER_TEMP/chemomae-constraints.txt"
          printf 'PIP_CONSTRAINT=%s\n' "$RUNNER_TEMP/chemomae-constraints.txt" >> "$GITHUB_ENV"

      - name: Install PyTorch (CPU)
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "${{ matrix.torch-requirement }}"

      - name: Install project and test deps
        env:
          PIP_DISABLE_PIP_VERSION_CHECK: "1"
        run: |
          python -m pip install -e ".[dev]"
          python -m pip check

      - name: Show library versions (debug)
        run: |
          python - << 'PY'
          import sys, numpy, sklearn, torch
          print("Python :", sys.version)
          print("NumPy  :", numpy.__version__)
          print("sklearn:", sklearn.__version__)
          print("Torch  :", torch.__version__, "(CUDA available:", torch.cuda.is_available(), ")")
          PY

      - name: Run tests
        env:
          MPLBACKEND: Agg
        run: |
          python -m pytest -q -ra -p no:cacheprovider tests

  installed-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build wheel and source distribution
        run: |
          python -m pip install "build>=1.2"
          python -m build

      - name: Install wheel without development extras
        run: |
          python -m venv "$RUNNER_TEMP/chemomae-wheel"
          "$RUNNER_TEMP/chemomae-wheel/bin/python" -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          "$RUNNER_TEMP/chemomae-wheel/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/chemomae-wheel/bin/python" -m pip check

      - name: Verify installed public CPU workflow outside checkout
        env:
          MPLBACKEND: Agg
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/chemomae-wheel/bin/python" -I "$GITHUB_WORKSPACE/tests/installed_package_smoke.py"

  documentation-examples:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install package without development extras
        run: |
          python -m pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2,<3"
          python -m pip install .
          python -m pip check

      - name: Run public documentation examples outside checkout
        env:
          MPLBACKEND: Agg
        run: |
          cd "$RUNNER_TEMP"
          python -I "$GITHUB_WORKSPACE/tests/documentation_examples.py"
